[package]
name = "validate-closes-completeness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "WASM hook plugin: PostToolUse gate that blocks lessons.md entries missing **Closes:** lines, forbidden per-mechanism annotations, umbrella cites without sample-vs-exhaustive flag, and undeclared documentary-historical exemptions (BC-5.39.007)"
publish = false

# Hook plugins ship as WASI commands (_start entry point) built via
# `cargo build --target wasm32-wasip1`. The [lib] target carries testable
# logic; [[bin]] wraps the entry point that calls into the lib.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "validate-closes-completeness"
path = "src/main.rs"

[dependencies]
vsdd-hook-sdk = { path = "../../hook-sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
# NOTE: No `regex` crate — hand-rolled scanning is used to stay within the
# WASM fuel budget. The regex crate's DFA compilation exhausts the fuel
# cap on first call. See src/lib.rs for hand-rolled lesson-entry and
# umbrella-cite scanning.

[dev-dependencies]
serde_json = { workspace = true }
vsdd-hook-sdk = { path = "../../hook-sdk" }

[lints]
workspace = true
