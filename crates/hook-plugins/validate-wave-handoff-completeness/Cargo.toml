[package]
name = "validate-wave-handoff-completeness"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "WASM hook plugin: PostToolUse gate that validates HANDOFF.md completeness on Write/Edit — blocks HandoffIncomplete when required ADR-026 §D2 fields are missing or malformed (BC-4.14.001)"
publish = false

# Hook plugins ship as WASI commands (_start entry point) built via
# `cargo build --target wasm32-wasip1`. The [lib] target carries testable
# logic; [[bin]] wraps the entry point that calls into the lib.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "validate-wave-handoff-completeness"
path = "src/main.rs"

[dependencies]
vsdd-hook-sdk = { path = "../../hook-sdk" }
serde_json = { workspace = true }
serde_norway = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
vsdd-hook-sdk = { path = "../../hook-sdk" }

[lints]
workspace = true
