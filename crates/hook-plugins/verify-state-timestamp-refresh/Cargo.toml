[package]
name = "verify-state-timestamp-refresh"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "WASM hook plugin: PreToolUse guard — blocks Edit/Write to .factory/STATE.md when proposed content does not advance timestamp: frontmatter (every write) or factory_lock.expires_at (when lock held). D16, S-17.04 / ADR-025 Decision 12 / BC-5.40.001 PC4."
publish = false

# Hook plugins ship as WASI commands (_start entry point) built via
# `cargo build --target wasm32-wasip1`. The [lib] target carries testable
# logic; [[bin]] wraps the macro-generated entry point that calls into the lib.
[lib]
path = "src/lib.rs"

[[bin]]
name = "verify-state-timestamp-refresh"
path = "src/main.rs"

[dependencies]
vsdd-hook-sdk = { path = "../../hook-sdk" }
# factory-lock-parse: shared parse primitives (D15). Imported for parse_factory_lock
# and extract_yaml_string_value. MUST NOT be verify-factory-lock directly (circular
# dependency footgun — both crates depend on factory-lock-parse, not each other).
factory-lock-parse = { path = "../factory-lock-parse" }
# serde_yaml/serde_norway FORBIDDEN — factory-lock-parse uses manual scan.
# regex FORBIDDEN — manual tokenisation only (Architecture Compliance Rule 4).

[dev-dependencies]
vsdd-hook-sdk = { path = "../../hook-sdk" }
serde_json = { workspace = true }

[lints]
workspace = true
