[package]
name = "factory-dispatcher"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "vsdd-factory v1.0 dispatcher binary — routes Claude Code hook events to WASM plugins"
publish = false

[[bin]]
name = "factory-dispatcher"
path = "src/main.rs"

[lib]
name = "factory_dispatcher"
path = "src/lib.rs"

[features]
# test-support: enables VSDD_ASYNC_DRAIN_WINDOW_MS env-override in release builds.
# Sole wired consumer: ci.yml build-dispatcher matrix "Test (cargo)" step
# (cargo test --release --features factory-dispatcher/test-support), which runs the
# bc_3_08_001_s19_05 integration tests with a generous drain window to accommodate
# WASM cold-start time. The bats-full-suite release binary (ci.yml bats-full-suite
# job "Build factory-dispatcher" step) is built WITHOUT this feature and uses the
# hardcoded ASYNC_DRAIN_WINDOW_MS = 100 ms.
# DI-019 v1.6 preserved: release.yml builds factory-dispatcher WITHOUT this feature
# so shipped artifacts always use ASYNC_DRAIN_WINDOW_MS = 100 ms.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
regex.workspace = true
chrono.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
tokio.workspace = true
tracing.workspace = true
sink-core = { path = "../sink-core", version = "0.0.1" }
sink-datadog = { path = "../sink-datadog", version = "0.0.1" }
sink-file = { path = "../sink-file", version = "0.0.1" }
sink-honeycomb = { path = "../sink-honeycomb", version = "0.0.1" }
sink-http = { path = "../sink-http", version = "0.0.1" }
sink-otel-grpc = { path = "../sink-otel-grpc", version = "0.0.1" }

[dev-dependencies]
tempfile.workspace = true
filetime.workspace = true
wat.workspace = true
# Mock OTLP receiver for the sinks_otel_grpc integration test (S-1.9).
# We pull in tokio + tonic + the same proto crate the sink uses so the
# mock and the real client share message types verbatim.
tokio.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
opentelemetry-proto.workspace = true
# S-4.07 integration tests: mock HTTP server for datadog/honeycomb/http sinks.
httpmock.workspace = true
# VP-075 proptest harness for resolver_determinism_proptest.rs (S-12.03).
proptest.workspace = true

[lints]
workspace = true
