[package]
name = "factory-lock"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Pure library crate: renew_lock, acquire_lock, clear_lock — content-in/content-out WASM-hermetic factory_lock CRUD operations on STATE.md frontmatter (S-18.04a, ADR-028)"
publish = false

# Pure library crate — NO [[bin]] target per story Forbidden Dependencies.
# No std::fs or host I/O. WASM-hermetic.
[lib]
path = "src/lib.rs"

[dependencies]
# factory-lock-parse: shared parse primitives (parse_factory_lock, LockState,
# extract_yaml_string_value, parse_iso8601). Dependency direction is unidirectional:
# factory-lock → factory-lock-parse; no cycles (Architecture Compliance Rule).
factory-lock-parse = { path = "../factory-lock-parse" }
# chrono 0.4 for expires_at = now + 2700s and YYYY-MM-DDTHH:MM:SSZ formatting.
# Format with chrono::format("%Y-%m-%dT%H:%M:%SZ") — NOT to_rfc3339() (AC-018 F-NW-008).
chrono = { workspace = true }

[dev-dependencies]
# No additional test-only dependencies needed; all logic is pure.

[lints]
workspace = true
