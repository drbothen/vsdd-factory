# Internal push-regex filters `git.*push.*factory-artifacts`; non-push Bash
# commands return Continue immediately (EC-011, sub-millisecond path).
# async = false REQUIRED — see ADR-019 + ADR-025

[[hooks]]
name = "verify-factory-lock-bash"
plugin = "hook-plugins/verify-factory-lock.wasm"
event = "PreToolUse"
tool = "^Bash$"
priority = 142
async = false
on_error = "continue"
timeout_ms = 5000

[hooks.capabilities.read_file]
path_allow = [".factory/STATE.md"]

[hooks.capabilities.exec_subprocess]
binary_allow = ["git"]
env_allow = ["HOME", "GIT_CONFIG_GLOBAL", "XDG_CONFIG_HOME"]

# ---------- verify-state-timestamp-refresh (PreToolUse, Edit|Write|MultiEdit) ----------
# S-17.04: PreToolUse guard — blocks Edit/Write/MultiEdit to .factory/STATE.md when
# proposed content (reconstructed for Edit/MultiEdit) does not advance timestamp:
# frontmatter (every write) or factory_lock.expires_at (when lock held).
# Decision 12 / BC-5.40.001 PC4.
# Trigger (v1.6 env-free): normalised path == ".factory/STATE.md" OR ends with
# "/.factory/STATE.md" — covers absolute paths from Claude Code production (AC-018).
# async = false REQUIRED — see ADR-019 + ADR-025 Decision 12

[[hooks]]
name = "verify-state-timestamp-refresh"
event = "PreToolUse"
tool = "^(Edit|Write|MultiEdit)$"
plugin = "hook-plugins/verify-state-timestamp-refresh.wasm"
priority = 143
timeout_ms = 5000
on_error = "continue"
async = false

[hooks.capabilities.read_file]
path_allow = [".factory/STATE.md"]

# ---------- PreCompact (S-18.00) ----------
# check-harness-version: verify Claude Code harness >= v2.1.105 before compaction.
# Advisory-only (on_error=continue): dispatcher continues even if the check fails.
# Registered as PreCompact per BC-1.15.001 INV3 and AC-008.
# Never sets block_intent — that is reserved for the `precompact-flush` PreCompact WASM plugin (S-18.04a).
# check-harness-version: real implementation in hooks/check-harness-version.sh (S-18.00; PreCompact advisory, on_error=continue).

[[hooks]]
name = "check-harness-version"
event = "PreCompact"
plugin = "hook-plugins/legacy-bash-adapter.wasm"
priority = 50
timeout_ms = 5000
on_error = "continue"
async = false

[hooks.config]
script_path = "hooks/check-harness-version.sh"

[hooks.capabilities]
env_allow = ["PATH", "HOME", "TMPDIR", "CLAUDE_PROJECT_DIR", "CLAUDE_PLUGIN_ROOT", "CLAUDE_CODE_VERSION", "CLAUDE_VERSION"]

[hooks.capabilities.exec_subprocess]
binary_allow = ["bash"]
shell_bypass_acknowledged = "legacy-bash-adapter runs unported hooks"
env_allow = ["PATH", "HOME", "TMPDIR", "CLAUDE_PROJECT_DIR", "CLAUDE_PLUGIN_ROOT", "CLAUDE_CODE_VERSION", "CLAUDE_VERSION"]

# ---------- precompact-flush native WASM plugin (S-18.04a) ----------
# Commits STATE.md to factory-artifacts branch BEFORE compaction proceeds.
# Native WASM — no bash, no shell_bypass_acknowledged (ADR-028 §Decision 2).
# binary_allow = ["git"] ONLY — PATH + SSH_AUTH_SOCK required for git push over SSH
# (dispatcher env_clear requires explicit re-injection per F-NW-001).
# priority = 100: fires AFTER check-harness-version (priority 50) so harness version
# is validated before the flush commit is attempted.
# on_error = "continue": fail-open per BC-7.07.001 INV6 (crash → advisory, not block).
# async = false: PreCompact hooks MUST fire synchronously (ADR-019 + BC-7.07.001 §PC1).
# (traces to AC-001 / BC-7.07.001 §Precondition 1 / ADR-028 §Decision 1)

[[hooks]]
name = "precompact-flush"
event = "PreCompact"
plugin = "hook-plugins/precompact-flush.wasm"
priority = 100
timeout_ms = 30000
on_error = "continue"
async = false

[hooks.capabilities.read_file]
path_allow = [".factory/"]

[hooks.capabilities.write_file]
path_allow = [".factory/"]

[hooks.capabilities.exec_subprocess]
binary_allow = ["git"]
env_allow = ["HOME", "GIT_CONFIG_GLOBAL", "XDG_CONFIG_HOME", "PATH", "SSH_AUTH_SOCK"]

# ---------- postcompact-reanchor advisory hook (S-18.05) ----------
# Reads current_cycle + current_step from factory-artifacts:.factory/STATE.md
# via git show; sources develop SHA from git rev-parse origin/develop at hook
# invocation (ADR-026 §Decision 7 / F-P1-001). READ-ONLY on factory-artifacts
# (BC-7.07.002 Inv1). on_error=continue: fail-open — PostCompact is advisory-only.
# GIT_DIR omitted (was a bats test-fixture artifact; not a production requirement).
# GIT_CONFIG_GLOBAL + XDG_CONFIG_HOME required by git subprocess (matches precompact-flush
# pattern). write_file covers JSONL log append; git show reads via exec_subprocess.
# (traces to AC-010 / BC-7.07.002 PC6 / DI-024 / ADR-026 §Decision 7)

[[hooks]]
name = "postcompact-reanchor"
event = "PostCompact"
plugin = "hook-plugins/legacy-bash-adapter.wasm"
priority = 100
timeout_ms = 10000
on_error = "continue"
async = false

[hooks.config]
script_path = "hooks/postcompact-reanchor.sh"

[hooks.capabilities]
env_allow = ["PATH", "HOME", "TMPDIR", "CLAUDE_PROJECT_DIR", "CLAUDE_PLUGIN_ROOT", "VSDD_SESSION_ID", "GIT_CONFIG_GLOBAL", "XDG_CONFIG_HOME"]

[hooks.capabilities.exec_subprocess]
binary_allow = ["bash", "git", "jq"]
shell_bypass_acknowledged = "legacy-bash-adapter runs unported hooks"
env_allow = ["PATH", "HOME", "TMPDIR", "CLAUDE_PROJECT_DIR", "CLAUDE_PLUGIN_ROOT", "VSDD_SESSION_ID", "GIT_CONFIG_GLOBAL", "XDG_CONFIG_HOME"]

[hooks.capabilities.write_file]
path_allow = [".factory/logs/"]

# ---------- validate-heavy-op-delegation advisory gate (S-18.06) ----------
# Pure-parse PreToolUse gate: emits DelegationRecommended advisory to stderr
# and plugin.log when a Bash command matches a configured heavy-operation pattern.
# NEVER blocks (BC-4.15.001 INV2). on_error=continue: fail-open — this gate is
# advisory-only and must never prevent Bash commands from running.
# tool="Bash": registry filter — non-Bash tool calls never dispatched (PC-D).
# [hooks.config] patterns: v1 default heavy-operation pattern list (BC-4.15.001 PC1).
# (traces to BC-4.15.001 / VP-091 / ADR-026 §Decision 12 / S-18.06 AC-008)

[[hooks]]
name = "validate-heavy-op-delegation"
event = "PreToolUse"
plugin = "hook-plugins/validate-heavy-op-delegation.wasm"
tool = "^Bash$"
on_error = "continue"
async = false
timeout_ms = 5000

[hooks.config]
patterns = [
  "cargo test --release",
  "grep -r",
  "grep -R",
  "find . -name",
  "find . -type",
  "./run-all.sh",
  "./run-bats.sh"
]
