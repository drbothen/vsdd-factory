# hooks-registry.toml — Human-edited source of truth as of v1.0.0.
# The v0.79.x→v1.0 migration generator has been retired; edit this file
# directly to add or modify hook registrations.
#
# Most entries route through hook-plugins/legacy-bash-adapter.wasm,
# which reads `[hooks.config] script_path` and execs the underlying
# bash script. Native-WASM ports (S-2.5 onward) replace individual
# entries one-by-one; 21 native-WASM ports (S-2.5+) coexist with
# 35 legacy-bash-adapter entries in this same file.

schema_version = 2

# ---------------------------------------------------------------------------
# TOOL-FILTER REGEX SEMANTICS (S-19.04 AC-003)
#
# The `tool` field in [[hooks]] entries is matched using regex SEARCH semantics
# (substring match), NOT fullmatch.  This means an unanchored value such as
#   tool = "Edit|Write"
# will also fire on "MultiEdit" (because "Edit" is a substring of "MultiEdit")
# and on any future tool whose name contains "Write" or "Edit" as a substring.
#
# ANCHORING CONVENTION — required for all new and existing entries:
#   Single tool:     tool = "^Bash$"
#   Multiple tools:  tool = "^(Edit|Write|MultiEdit)$"
#
# Why anchoring matters:
#   Without anchoring,  tool = "Edit"       matches MultiEdit, MultiEdit*, etc.
#   Without anchoring,  tool = "Write"      would match a hypothetical MultiWrite.
#   Without anchoring,  tool = "Bash"       would match a hypothetical BashAsync.
#   With prefix-only,   tool = "^Bash"      STILL matches BashAsync via regex-SEARCH — both anchors required.
#
# Entries that intentionally rely on unanchored (prefix/substring) matching MUST
# carry an inline `# intent:` comment explaining the design choice (EC-001).
# The AC-005 bats lint test enforces this invariant in CI:
#   Every tool= line must be fully anchored (leading ^ AND trailing $ immediately
#   before the closing quote) or carry an # intent: comment.
# ---------------------------------------------------------------------------

# ---------- SessionStart ----------

[[hooks]]
name = "session-start-telemetry"
event = "SessionStart"
plugin = "hook-plugins/session-start-telemetry.wasm"
timeout_ms = 8000
async = true

[hooks.capabilities.read_file]
path_allow = [".claude/settings.local.json"]

[hooks.capabilities.exec_subprocess]
binary_allow = ["factory-health"]

# ---------- SessionEnd ----------

[[hooks]]
