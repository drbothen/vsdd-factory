# ---------- validate-burst-log (PostToolUse, Bash — ADR-029 §Decision 1) ----------
# Chain-detection gate: reads git_context from payload.extra (injected by dispatcher
# host layer on PostToolUse Bash git-commit events). WASM is exec-free:
# no exec_subprocess for commit-context acquisition (BC-5.41.003 PC1; ADR-029 §Decision 3).
# Fail-open: absent/empty git_context → Continue (BC-5.41.003 Invariant 5; BC-1.16.001 INV3).
# Same WASM binary as Edit|Write entry above; dispatches on tool_name == "Bash" internally.

[[hooks]]
name = "validate-burst-log"
event = "PostToolUse"
