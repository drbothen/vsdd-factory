# sprint-state-format fixture: partial status accepted by consumer allowlist
# Used by: test_consumer_accepts_partial_status (regression guard for F-P1-002 partial removal)
# BC-5.41.004 INV-1: partial IS in the 8-value canonical enum
# BC-5.41.002 PC3: partial is neither terminal nor draft/pending →
#   classified as BROKEN_STORY_IDS; BrokenSprintState fires ONLY when no draft exists.
#   With S-1.02 draft present, skill exits 0 (has-next-wave), not BrokenSprintState.
#
# Wave topology:
#   S-1.01: merged  — terminal (completed wave 1)
#   S-1.02: partial — non-terminal, non-draft → BROKEN_STORY_IDS (but has_next_wave=0 so far)
#   S-1.03: draft   — next-wave selector → has_next_wave=1; BrokenSprintState suppressed
# Expected consumer outcome: exit 0, CLASSIFY_RESULT=has-next-wave

stories:
  - id: S-1.01
    status: merged
  - id: S-1.02
    status: partial
  - id: S-1.03
    status: draft
