name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    # Run on PRs targeting main OR develop. Without develop coverage,
    # the bats run-all.sh suite was silently un-gated on develop pushes
    # (only the lighter `semgrep` workflow ran), and the same suite
    # blocked release.yml's `validate` job when those PRs landed —
    # which kept rc.11/rc.12/rc.13 off the marketplace. Adding develop
    # closes that gap.
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Mount factory artifacts
        run: |
          git fetch origin factory-artifacts:refs/remotes/origin/factory-artifacts
          git rev-parse origin/factory-artifacts || (echo "factory-artifacts ref missing — check fetch step" >&2; exit 1)
          git worktree add .factory origin/factory-artifacts

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bats
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Syntax check shell scripts
        run: |
          set -e
          for f in plugins/vsdd-factory/hooks/*.sh plugins/vsdd-factory/bin/*; do
            bash -n "$f"
          done
          echo "all scripts ok"

      - name: Run hook tests
        run: bats plugins/vsdd-factory/tests/hooks.bats

      - name: Run block-helper tests
        run: bats tests/integration/hooks/block-helper.bats

      - name: Run bin tests
        run: bats plugins/vsdd-factory/tests/bin.bats

      - name: Check bats files for orphan hook references
        run: bash plugins/vsdd-factory/tests/check-bats-orphans.sh

      - name: Validate plugin manifest JSON
        # As of v1.0.0-rc.7:
        #   - .claude-plugin/marketplace.json was removed (marketplace
        #     now lives at drbothen/claude-mp; this repo only ships
        #     the plugin).
        #   - plugins/vsdd-factory/hooks/hooks.json was untracked per
        #     S-0.4 design intent (per-machine, created by activation
        #     copying the right hooks.json.<platform> variant).
        # Only plugin.json + the per-platform variants belong here now.
        run: |
          jq empty plugins/vsdd-factory/.claude-plugin/plugin.json
          for variant in plugins/vsdd-factory/hooks/hooks.json.*; do
            [ -f "$variant" ] || continue
            jq empty "$variant"
          done

      - name: Verify hooks.json.<platform> variants match template
        # Drift check for S-0.4: hooks.json.template is the source of
        # truth for the v1.0 dispatcher's per-platform hook configs.
        # CI regenerates the 5 variants and diffs against the committed
        # files; any drift fails the build with a clean diff so the
        # operator knows exactly which variant to refresh.
        run: scripts/generate-hooks-json.sh --check

      - name: Verify plugin.json declares a valid version
        # Pre-rc.7 this step also cross-checked .claude-plugin/marketplace.json
        # to catch the v0.68.1/v0.69.0 failure mode (plugin.json bumped but
        # marketplace.json left stale). As of rc.7, marketplace.json no
        # longer lives in this repo (moved to drbothen/claude-mp), so the
        # cross-repo version sync is now an out-of-band concern handled by
        # the bump-marketplace job in release.yml. We still sanity-check
        # plugin.json has a parseable version.
        run: |
          PLUGIN_VERSION=$(jq -r '.version' plugins/vsdd-factory/.claude-plugin/plugin.json)
          if [ -z "$PLUGIN_VERSION" ] || [ "$PLUGIN_VERSION" = "null" ]; then
            echo "::error::Could not read plugin.json version (got: $PLUGIN_VERSION)"
            exit 1
          fi
          echo "plugin.json version: $PLUGIN_VERSION"

      - name: Parse all workflow files
        run: |
          for f in plugins/vsdd-factory/workflows/*.lobster plugins/vsdd-factory/workflows/phases/*.lobster; do
            plugins/vsdd-factory/bin/lobster-parse "$f" '.workflow.name' >/dev/null
          done
          echo "all workflows parse"

  cargo-host:
    # Fast-feedback Rust workspace gates (S-1.1) on the two host runners.
    # Targets ~1-3 min wall-clock; designed to fail before the slower
    # 5-platform `build-dispatcher` matrix burns runner minutes. The two
    # jobs intentionally coexist: cargo-host is the pre-flight check,
    # build-dispatcher (S-2.3) is the full-coverage gate.
    name: cargo-host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        # Pinned in rust-toolchain.toml — keep this version in sync with that file.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Cache cargo
        # Pinned to commit SHA for security (TD #74); resolves to v2.9.1.
        # SHA verified: no open GitHub Security Advisories; last 10 commits
        # are routine dependabot bumps; tag v2.9.1 is GPG-signed by maintainer.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true

      - name: cargo fmt --check --all
        run: cargo fmt --check --all

      - name: cargo clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: cargo test (workspace, all targets)
        # VSDD_SKIP_PRODUCTION_STATE_MD_TEST=1: validate-dispatch-advance
        # has load-bearing production-file tests (validate_production_state_md_no_false_positive,
        # validate_production_edp1_index_md_no_false_positive) that read
        # .factory/STATE.md and .factory/cycles/.../INDEX.md from the
        # factory-artifacts orphan branch. The Mount factory artifacts step
        # in this job runs AFTER cargo test (it needs the Rust toolchain
        # that precedes it, and must precede the bats steps that follow).
        # The tests support an explicit opt-out via this env var for exactly
        # this scenario — ephemeral CI runners without a factory worktree
        # mounted at test time. Local dev (where .factory/ is always mounted)
        # continues to exercise these tests without the env var set.
        env:
          VSDD_SKIP_PRODUCTION_STATE_MD_TEST: "1"
        run: cargo test --workspace --all-targets

      - name: cargo publish --dry-run (hook-sdk crates) (S-2.5)
        # Catches publishability regressions every push: missing
        # README, missing license metadata, broken sibling version
        # pin, etc. We use `--workspace` because the parent crate
        # depends on its sibling via path+version, and cargo's
        # single-crate dry-run cannot resolve the sibling until it's
        # actually on crates.io. The workspace mode stages both into
        # a tmp registry and verifies them together. CI is always
        # clean so we omit `--allow-dirty`.
        run: cargo publish --dry-run --workspace -p vsdd-hook-sdk-macros -p vsdd-hook-sdk

      - name: cargo build (all native WASM plugins, wasm32-wasip1)
        # Build all hook-plugin crates to catch compilation regressions
        # across the full plugin set (CRIT-W15-001 / W-15-gate fix).
        run: |
          cargo build -p legacy-bash-adapter --bin legacy-bash-adapter --target wasm32-wasip1
          cargo build -p update-wave-state-on-merge --target wasm32-wasip1 --no-default-features
          cargo build --target wasm32-wasip1 \
            --workspace \
            --exclude legacy-bash-adapter \
            --exclude update-wave-state-on-merge \
            --exclude factory-dispatcher \
            --exclude sink-core --exclude sink-file --exclude sink-otel-grpc \
            --exclude sink-http --exclude sink-datadog --exclude sink-honeycomb \
            --exclude vsdd-hook-sdk-macros \
            --exclude read-prefix-fixture  # fixture crate for S-19.06 AC-007 compile/link gate (bats T-009f); test-only, never a release artifact (POLICY 20)

      - name: cargo build (hello-hook example, wasm32-wasip1)
        # Compiling the example end-to-end exercises the #[hook] macro
        # expansion + the SDK's stdin/panic/result framing on the real
        # plugin target. If the macro regresses, this catches it before
        # any plugin author sees it.
        run: cargo build -p vsdd-hook-sdk --example hello-hook --target wasm32-wasip1

      - name: Verify all native WASM plugins built
        shell: bash
        run: |
          # P5-H1 (S-17.04): derive floor from crates that actually produce a WASM binary
          # (those with a [[bin]] section in Cargo.toml) rather than raw dir count.
          # A lib-only crate under hook-plugins/ (e.g. factory-lock-parse before relocation)
          # does not produce a .wasm and must not inflate the floor — doing so would make
          # this assertion fail even when all real plugins built successfully.
          # The [[bin]] grep is robust: it returns the right floor both before and after
          # the implementer relocates any lib-only crate out of hook-plugins/.
          expected=$(grep -rl '^\[\[bin\]\]' crates/hook-plugins/*/Cargo.toml | grep -v read-prefix-fixture | wc -l | tr -d ' ')
          count=$(ls target/wasm32-wasip1/debug/*.wasm 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -lt "$expected" ]; then
            echo "::error::Only $count wasm files built; expected >= $expected (wasm-producing crates in crates/hook-plugins/ with [[bin]])."
            ls target/wasm32-wasip1/debug/*.wasm 2>/dev/null || true
            exit 1
          fi
          echo "Built $count wasm files (floor: $expected wasm-producing crates in crates/hook-plugins/)."

      - name: Mount factory artifacts (for perf-baseline bats)
        # perf-baseline.bats needs .factory/ (script + fixture + baseline doc).
        # Must run in cargo-host (not validate) because setup_file() calls
        # `cargo build --release -p factory-dispatcher` when the binary is absent,
        # and the validate job has no Rust toolchain.
        run: |
          git fetch origin factory-artifacts:refs/remotes/origin/factory-artifacts
          git rev-parse origin/factory-artifacts || (echo "factory-artifacts ref missing" >&2; exit 1)
          git worktree add .factory origin/factory-artifacts

      - name: Stage WASM plugins to hook-plugins directory
        # plugins/vsdd-factory/hook-plugins/ is gitignored (.gitignore:58) —
        # the committed directory holds machine-local builds and is never checked in.
        # CI must populate it from the debug build artifacts before running ANY bats
        # test that invokes the dispatcher — including perf-baseline.bats, which calls
        # the dispatcher when measuring hook invocation latency and needs the WASM
        # plugins staged in hook-plugins/ to avoid "plugin not found" failures.
        # Positioned BEFORE perf-baseline.bats (F-P6-001 fix; prior pass-5 had this
        # step after perf-baseline, causing perf-baseline false-greens when the
        # dispatcher skipped hooks due to missing plugins).
        # The release.yml "Stage wasm plugins" step is the canonical staging pattern;
        # this mirrors it for the CI (debug) path.
        shell: bash
        run: |
          mkdir -p plugins/vsdd-factory/hook-plugins
          # Skip underscore-named lib-target stubs (wasm32-wasip1 produces both a
          # hyphen-named binary and an underscore-named lib for each crate). The outer
          # *_*.wasm glob matches any WASM basename containing '_'; those files are
          # not in any registry and must not contaminate hook-plugins/.
          # Test gate: crates/factory-dispatcher/tests/bundle_orphan_check.rs::stage_release_bundle
          for wasm in target/wasm32-wasip1/debug/*.wasm; do
            [ -f "$wasm" ] || continue
            name=$(basename "$wasm")
            case "$name" in
              *_*.wasm) echo "skip lib-target stub: $name"; continue ;;
              read-prefix-fixture.wasm) echo "skip stale-cache fixture artifact: $name (POLICY 20)"; continue ;;
            esac
            cp "$wasm" plugins/vsdd-factory/hook-plugins/
          done
          # P5-H1 (S-17.04): derive floor from wasm-producing crates only (those with [[bin]])
          # so that a lib-only crate under hook-plugins/ does not inflate the floor and
          # cause false failures when all real plugins built successfully.
          expected=$(grep -rl '^\[\[bin\]\]' crates/hook-plugins/*/Cargo.toml | grep -v read-prefix-fixture | wc -l | tr -d ' ')
          count=$(ls plugins/vsdd-factory/hook-plugins/*.wasm 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -lt "$expected" ]; then
            echo "::error::Only $count WASM plugins staged; expected >= $expected (wasm-producing crates in crates/hook-plugins/ with [[bin]]). Build output:"
            ls target/wasm32-wasip1/debug/*.wasm 2>/dev/null || echo "  (no wasm files in debug target)"
            exit 1
          fi
          echo "Staged $count WASM plugins to hook-plugins/ (floor: $expected wasm-producing crates in crates/hook-plugins/)."
          ls plugins/vsdd-factory/hook-plugins/

      - name: Build factory-dispatcher (release, for e2e bats)
        # The verify-state-timestamp-refresh e2e bats tests invoke the dispatcher binary
        # at target/release/factory-dispatcher (set in bats setup() as $DISPATCHER).
        # The preceding WASM build steps use --target wasm32-wasip1 only and never
        # produce a native binary — cargo-host had no release dispatcher build at all.
        # cargo test (above) builds a debug dispatcher but bats setup() hard-codes the
        # release path. Build --release here so the artifact is present at the exact
        # path _require_artifacts() checks before CI_REQUIRE_ARTIFACTS hard-fails.
        # Incremental: workspace deps are already compiled by cargo test above; only
        # the final factory-dispatcher link step runs here (fast, ~10s).
        run: cargo build --release -p factory-dispatcher

      - name: Run verify-state-timestamp-refresh e2e tests (P5-M1)
        # P5-M1 (S-17.04): verify-state-timestamp-refresh.bats has 6 dispatcher+WASM
        # e2e tests (T-1..T-6) that call _require_artifacts() and hard-fail under
        # CI_REQUIRE_ARTIFACTS=1 if either artifact is absent (no silent skip-pass).
        #
        # Artifact paths _require_artifacts() checks:
        #   $DISPATCHER  = <repo-root>/target/release/factory-dispatcher
        #                  (built by the preceding step)
        #   $GUARD_WASM  = plugins/vsdd-factory/hook-plugins/verify-state-timestamp-refresh.wasm
        #                  (staged by "Stage WASM plugins to hook-plugins directory" above)
        # Both are now guaranteed present before this step runs.
        shell: bash
        env:
          CI_REQUIRE_ARTIFACTS: "1"
        run: |
          sudo apt-get install -y jq bats 2>/dev/null || brew install jq bats 2>/dev/null || true
          bats plugins/vsdd-factory/tests/verify-state-timestamp-refresh.bats

      - name: Run S-9.00 perf-baseline tests
        # Requires: Rust toolchain (for setup_file cargo build), jq, and .factory/
        # mounted above. hyperfine is not installed; cold-start test skips gracefully.
        # The factory-dispatcher release binary is built by the preceding step, so
        # setup_file() will skip its own build and proceed directly to tests.
        # WASM plugins are staged by the "Stage WASM plugins" step — perf-baseline.bats
        # dispatcher invocations will find plugins in hook-plugins/ (F-P6-001 ordering fix).
        shell: bash
        run: |
          sudo apt-get install -y jq bats 2>/dev/null || brew install jq bats 2>/dev/null || true
          bats plugins/vsdd-factory/tests/perf-baseline.bats

      - name: Run resolver integration tests (F-P4-002)
        # F-P4-002: resolver-integration.bats and resolver-capability-confinement.bats
        # were authored in F-P3 but were never invoked by CI on PRs (only by
        # release.yml → run-all.sh). These tests require the dispatcher binary
        # (cargo-host builds it above) and bats (installed in the perf-baseline step).
        # E-8 integration tests (tests/integration/E-8-hook-plugins/) are also covered
        # here — they live outside plugins/vsdd-factory/tests/ so run-all.sh misses them.
        # WASM plugins are staged by the preceding step (F-P5-001).
        shell: bash
        run: |
          bats plugins/vsdd-factory/tests/resolver-integration.bats
          bats plugins/vsdd-factory/tests/resolver-capability-confinement.bats
          bats tests/integration/E-8-hook-plugins/warn-pending-wave-gate.bats

  platforms-drift:
    # Single source of truth: ci/platforms.yaml. The build-dispatcher
    # matrix below duplicates the same 5 (platform, os, target) tuples
    # inline because GitHub Actions does not natively read external YAML
    # into matrix: expressions. This job parses both and asserts they
    # agree — any drift fails fast with a clean diff so the operator
    # knows exactly which side to refresh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yq + python3-yaml
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          python3 -c "import yaml" 2>/dev/null || sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Lint ci/platforms.yaml is parseable
        run: |
          python3 -c "import yaml; yaml.safe_load(open('ci/platforms.yaml'))"
          echo "ci/platforms.yaml parses ok"

      - name: Compare canonical platforms.yaml vs build-dispatcher matrix
        run: |
          # Extract the (platform, os, target, use_cross, run_tests) tuples
          # from both ci/platforms.yaml and the inline build-dispatcher
          # matrix in ci.yml, then diff. This catches the drift class
          # where someone bumps a runner label in one file but forgets
          # the other, which would otherwise only surface on the next
          # release-tag build. Failure shows the full diff so the author
          # sees exactly which line to update.
          python3 scripts/check-platforms-drift.py

  build-dispatcher:
    # 5-platform full-coverage build + test gate (S-2.3). Source of truth
    # for the matrix entries below: ci/platforms.yaml. If you change one,
    # change both — the platforms-drift job above will fail otherwise.
    #
    # Runner label notes (verified 2026-04 against
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners):
    #   - macos-14         : arm64 (Apple Silicon M1)
    #   - macos-15-intel   : Intel x86_64; macos-13 was retired 2025-12-04
    #   - macos-latest     : alias for macos-15 (arm64) — NOT used here
    #                        because the matrix needs explicit arch pinning
    #   - ubuntu-latest    : x86_64 Linux; aarch64 builds use cross-rs
    #   - windows-latest   : Windows Server x86_64 with MSVC build tools
    name: build-dispatcher (${{ matrix.platform }})
    needs: platforms-drift
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            use_cross: false
            run_tests: true
            exe_suffix: ""
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            use_cross: false
            run_tests: true
            exe_suffix: ""
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            run_tests: true
            exe_suffix: ""
          - platform: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            # Tests skipped: cargo-cross builds in a Docker image, but
            # the host runner is x86_64 and cannot exec aarch64 binaries
            # without qemu-user-static. Native arm64-Linux GH runners
            # (when affordable) would let us flip this to true.
            run_tests: false
            exe_suffix: ""
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            run_tests: true
            exe_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        # Pinned to rust-toolchain.toml (1.95.0). `targets:` here adds
        # both the platform-specific triple AND wasm32-wasip1 in one
        # rustup invocation — the action handles the union internally.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}, wasm32-wasip1

      - name: Cache cargo
        # Key includes platform + target so the 5 jobs don't trample
        # each other's cache. Swatinem/rust-cache@v2 already keys on
        # Cargo.lock + rust-toolchain.toml under the hood; we add the
        # matrix axes via shared-key.
        # Pinned to commit SHA for security (TD #74); resolves to v2.9.1.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: build-dispatcher-${{ matrix.platform }}-${{ matrix.target }}
          cache-on-failure: true

      - name: Install cross-rs/cross
        # Only the linux-arm64 entry sets use_cross=true. cross gives us
        # a Docker-based aarch64-linux toolchain without any host setup.
        # Pinning to a specific git rev keeps the build reproducible;
        # `master` is what cross-rs upstream recommends until they cut a
        # versioned release that supports the modern Rust + glibc combo.
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 588b3c99db52b5a9c5906fab96cfadcf1bde7863

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        # `cargo build --release --target X` builds every workspace
        # member that compiles for X. factory-dispatcher is the binary
        # we ship; the libraries get built as a side effect (and cached).
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Test (cargo)
        if: ${{ matrix.run_tests && !matrix.use_cross }}
        # --workspace runs every package's tests; --all-targets includes
        # integration + doc tests so the regression coverage matches
        # cargo-host. We don't pass --target here for native runs because
        # the host triple equals matrix.target; passing it makes cargo
        # rebuild std-test infrastructure for no benefit.
        # VSDD_SKIP_PRODUCTION_STATE_MD_TEST=1: validate-dispatch-advance
        # has production-file tests that read .factory/STATE.md and
        # .factory/cycles/.../INDEX.md from the factory-artifacts orphan
        # branch, which is not mounted in this job. Tests skip gracefully
        # when this env var is set — local dev (where .factory/ is always
        # mounted) exercises these tests without the env var.
        env:
          VSDD_SKIP_PRODUCTION_STATE_MD_TEST: "1"
        run: cargo test --release --features factory-dispatcher/test-support --target ${{ matrix.target }} --workspace

      - name: Build all native WASM plugins (release)
        # Build all hook-plugin crates on every matrix entry —
        # proves all plugins compile against the same toolchain as the
        # native dispatcher. Catches feature-flag drift and compilation
        # regressions across the full plugin set (CRIT-W15-001 / W-15-gate fix).
        shell: bash
        run: |
          cargo build --release -p legacy-bash-adapter --bin legacy-bash-adapter --target wasm32-wasip1
          cargo build --release -p update-wave-state-on-merge --target wasm32-wasip1 --no-default-features
          cargo build --release --target wasm32-wasip1 \
            --workspace \
            --exclude legacy-bash-adapter \
            --exclude update-wave-state-on-merge \
            --exclude factory-dispatcher \
            --exclude sink-core --exclude sink-file --exclude sink-otel-grpc \
            --exclude sink-http --exclude sink-datadog --exclude sink-honeycomb \
            --exclude vsdd-hook-sdk-macros \
            --exclude read-prefix-fixture  # fixture crate for S-19.06 AC-007 compile/link gate (bats T-009f); test-only, never a release artifact (POLICY 20)

      - name: Build wasm hello-hook example
        run: cargo build -p vsdd-hook-sdk --example hello-hook --target wasm32-wasip1 --release

      - name: Verify all native WASM plugins built (release)
        shell: bash
        run: |
          # P5-H1 (S-17.04): derive floor from wasm-producing crates only (those with [[bin]])
          # so that a lib-only crate under hook-plugins/ does not inflate the floor and
          # cause false failures when all real plugins built successfully.
          expected=$(grep -rl '^\[\[bin\]\]' crates/hook-plugins/*/Cargo.toml | grep -v read-prefix-fixture | wc -l | tr -d ' ')
          count=$(ls target/wasm32-wasip1/release/*.wasm 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -lt "$expected" ]; then
            echo "::error::Only $count wasm files built (release); expected >= $expected (wasm-producing crates in crates/hook-plugins/ with [[bin]])."
            ls target/wasm32-wasip1/release/*.wasm 2>/dev/null || true
            exit 1
          fi
          echo "Built $count wasm files (release) (floor: $expected wasm-producing crates in crates/hook-plugins/)."

      - name: Stage artifacts
        # Collect the dispatcher binary + every .wasm file into a single
        # staging dir. `find -maxdepth 1` avoids picking up incremental
        # build .wasm artifacts under deps/. Windows uses bash via the
        # default shell on windows-latest, so `cp` works on all 3 OSes.
        shell: bash
        run: |
          set -e
          mkdir -p artifact-staging
          cp "target/${{ matrix.target }}/release/factory-dispatcher${{ matrix.exe_suffix }}" artifact-staging/
          # Skip underscore-named lib-target stubs (mirrors *_*.wasm outer case arm
          # in release.yml "Stage artifact directory" and "Stage wasm plugins" steps).
          # [ -f ] guard handles glob-matches-nothing (no wasm files built on this run).
          # Test gate: crates/factory-dispatcher/tests/bundle_orphan_check.rs::stage_release_bundle
          for wasm in target/wasm32-wasip1/release/*.wasm; do
            [ -f "$wasm" ] || continue
            name=$(basename "$wasm")
            case "$name" in
              *_*.wasm) echo "skip lib-target stub: $name"; continue ;;
              read-prefix-fixture.wasm) echo "skip stale-cache fixture artifact: $name (POLICY 20)"; continue ;;
            esac
            cp "$wasm" artifact-staging/
          done
          ls -la artifact-staging/

      - name: Upload artifacts
        # 14-day retention is the GH Actions default; explicit for clarity.
        # These artifacts are CI inspection output only (available in the Actions UI
        # for debugging cross-platform build issues). release.yml's build-binaries job
        # produces its own staged artifacts independently via separate build runs;
        # nothing downstream downloads this upload for bundling.
        uses: actions/upload-artifact@v4
        with:
          name: factory-dispatcher-${{ matrix.platform }}
          path: artifact-staging/
          retention-days: 14
          if-no-files-found: error

  bats-full-suite:
    # Mirrors release.yml's Pre-release Validation job so every PR to develop/main
    # runs the FULL bats run-all.sh suite on Linux before merge.
    # Root cause: ci.yml previously ran only individual bats suites (hooks.bats,
    # bin.bats, permissions.bats, hook-robustness.bats etc.) but NOT run-all.sh,
    # so failures caught by run-all.sh on release tag (e.g. shellcheck SC2317 on
    # a newer ubuntu shellcheck, inline-backtick lint violations) went undetected
    # until the release.yml validate job ran.
    name: bats-full-suite (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Mount factory artifacts
        # run-all.sh suites that validate STATE.md / cycle artifacts need .factory/.
        # Mirrors release.yml's Mount factory artifacts step exactly.
        run: |
          git fetch origin factory-artifacts
          git worktree add .factory origin/factory-artifacts

      - name: Configure git identity
        # factory-lock-write.bats and factory-lock-skills-integration.bats tests
        # call factory-cas-push.sh which requires a valid git user.email/name to
        # author commits. Without this, those tests fail on a fresh CI runner.
        run: |
          git config --global user.email "ci-bats@vsdd-factory.test"
          git config --global user.name "CI Bats Runner"

      - name: Install tools
        # bats + yq are required by run-all.sh.
        # shellcheck is pre-installed on ubuntu-latest — the same version that
        # flags SC2317 on trap handlers, which is exactly the signal we want to
        # catch here so it no longer reaches the release tag.
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install Rust toolchain
        # Needed to build factory-dispatcher (release) below.
        # Pinned to rust-toolchain.toml version — keep in sync with cargo-host.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        # Pinned to commit SHA for security (TD #74); resolves to v2.9.1.
        # shared-key suffix -v2: busts stale cache that held a pre-F-P5-003
        # validate-state-structure.wasm binary (built before the banner-block-scoped
        # scan fix); without the suffix, the cache hit restores the old artifact and
        # bats pass-real-state-md-snapshot fails with "no SIZE BUDGET banner found".
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: bats-full-suite-linux-v2
          cache-on-failure: true

      - name: Build factory-dispatcher (release)
        # Dispatcher-dependent bats suites (regression-v1.0, td-71-stderr-block-reason,
        # per-story-adversary-convergence-hook, etc.) skip gracefully when the binary
        # is absent. Building it here ensures those suites run rather than skip,
        # giving full coverage. Target path: target/release/factory-dispatcher —
        # matches $REPO_ROOT/target/release/factory-dispatcher in bats setup().
        run: cargo build --release -p factory-dispatcher

      - name: Stage WASM plugins for run-all.sh
        # Suites that invoke the dispatcher live-test need the WASM plugins staged
        # in plugins/vsdd-factory/hook-plugins/ (the dispatcher's plugin lookup path).
        # Build WASM release artifacts — mirroring build-dispatcher's "Build all
        # native WASM plugins (release)" step. Release builds match the production
        # fuel profile; debug builds exhaust the 10M-instruction fuel cap during
        # serde_json deserialization, causing on_error=block adapters to fail-closed
        # and the dispatcher to exit 2 in bats tests that use the full registry.
        shell: bash
        run: |
          cargo build --release --target wasm32-wasip1 \
            -p legacy-bash-adapter --bin legacy-bash-adapter
          cargo build --release --target wasm32-wasip1 \
            -p update-wave-state-on-merge --no-default-features
          cargo build --release --target wasm32-wasip1 \
            --workspace \
            --exclude legacy-bash-adapter \
            --exclude update-wave-state-on-merge \
            --exclude factory-dispatcher \
            --exclude sink-core --exclude sink-file --exclude sink-otel-grpc \
            --exclude sink-http --exclude sink-datadog --exclude sink-honeycomb \
            --exclude vsdd-hook-sdk-macros \
            --exclude read-prefix-fixture  # fixture crate for S-19.06 AC-007 compile/link gate (bats T-009f); test-only, never a release artifact (POLICY 20)
          mkdir -p plugins/vsdd-factory/hook-plugins
          # Skip underscore-named lib-target stubs (mirrors *_*.wasm outer case arm in
          # release.yml "Stage artifact directory" and "Stage wasm plugins" steps).
          # Test gate: crates/factory-dispatcher/tests/bundle_orphan_check.rs::stage_release_bundle
          for wasm in target/wasm32-wasip1/release/*.wasm; do
            [ -f "$wasm" ] || continue
            name=$(basename "$wasm")
            case "$name" in
              *_*.wasm) echo "skip lib-target stub: $name"; continue ;;
              read-prefix-fixture.wasm) echo "skip stale-cache fixture artifact: $name (POLICY 20)"; continue ;;
            esac
            cp "$wasm" plugins/vsdd-factory/hook-plugins/
          done

      - name: Run full bats suite (run-all.sh)
        # This is the canonical gate that release.yml runs. Running it on every PR
        # catches failures before they reach the release tag.
        #
        # pr-manager-hardening.bats is included via the tests/*.bats glob in run-all.sh
        # (F-S1901-P9-001): platform-independent security tests (T-001..T-007, T-009..T-016,
        # T-018..T-031) run and gate on this Linux job; platform-specific tests
        # (T-008 darwin-leg wrong-interpreter, T-017 bash-3.2 fragment negative-control)
        # self-skip on non-Darwin via [[ "$(uname)" != "Darwin" ]] guards. T-009 (Linux
        # runner exits 0) executes its real path exclusively on this Linux job.
        # WASM: pr-manager-completion-guard.wasm is staged above (workspace build);
        # setup_file() on-demand build is a no-op when the artifact is already present.
        run: cd plugins/vsdd-factory/tests && ./run-all.sh

  bats-wave-handoff-macos:
    # BSD/macOS portability gate (F-P11-002). The bats-full-suite job above runs
    # run-all.sh on ubuntu-latest (GNU grep/sed/awk/date). This job exercises the
    # wave-handoff and wave-gate-hooks suites on macos-latest (BSD grep/sed/awk)
    # to catch POSIX divergence that silently passes under GNU tooling:
    #
    #   * grep -E '\s' on BSD grep matches literal 's', not whitespace class
    #   * sed -i requires an extension argument on BSD sed
    #   * date -u formatting flags differ between GNU coreutils and BSD date
    #   * find -regex and awk exit-condition semantics have BSD/GNU divergence
    #
    # Root cause: F-P11-001 (BSD-grep \s silent failure → wave misclassification)
    # was hidden because CI only ran the full suite on Linux. This job closes that
    # coverage gap for the operator-invoked shell skills in E-18.
    #
    # COVERAGE SCOPE — intentionally scoped to pure-shell suites:
    #   INCLUDED:  wave-handoff.bats     (POSIX bash+awk+grep+git; no jq/yq/dispatcher)
    #              wave-gate-hooks.bats  (jq only; no dispatcher/WASM/Rust)
    #   EXCLUDED:  Full run-all.sh suite — many suites require the factory-dispatcher
    #              native binary + WASM plugins (built by cargo build --release), which
    #              would add ~15 min Rust cross-compile on a fresh macOS runner.
    #              The cargo-host matrix job already runs Rust tests on macos-latest;
    #              full bats-with-dispatcher macOS coverage is tracked as a future
    #              enhancement once TD #70 (release pipeline build-time optimization)
    #              lands and cache warm-up for macOS bats is economical.
    #
    # BLOCKING: this job is a required status check equivalent — it uses the same
    # `on:` trigger as all other jobs (PRs to main/develop). Any failure blocks merge.
    name: bats-wave-handoff (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        # bats, jq, bash, and PyYAML are the runtime requirements for wave-handoff.bats
        # and wave-gate-hooks.bats:
        #   bash >= 4: associative arrays (declare -A / local -A) in write-wave-state.sh;
        #              macOS ships bash 3.2, Homebrew bash 5 provides the required version.
        #   PyYAML: validate-wave-gate-prerequisite.sh uses 'import yaml' for YAML parsing
        #           (documented requirement in hook header); absent on macOS runners.
        # Neither suite uses yq, the Rust toolchain, or the dispatcher binary.
        run: |
          brew install bats-core jq bash
          pip3 install --quiet --break-system-packages pyyaml

      - name: Configure git identity
        # wave-handoff.bats creates hermetic git repos in temp dirs and makes commits
        # inside them. A valid git user identity is required; without it git commit
        # fails with "Please tell me who you are." on a fresh CI runner.
        run: |
          git config --global user.email "ci-bats@vsdd-factory.test"
          git config --global user.name "CI Bats Runner"

      - name: Run wave-handoff bats (BSD/macOS)
        # The wave-handoff skill (and other E-18 shell skills) is operator-invoked on
        # macOS/BSD as well as Linux. Running these suites on BSD grep/sed/awk/date
        # catches POSIX divergence (e.g., grep -E '\s' → BSD literal 's' vs GNU
        # whitespace class) before it reaches operators running on macOS/BSD.
        # PATH is extended to pick up Homebrew bash 5 (required for declare -A in
        # write-wave-state.sh) ahead of the macOS system bash 3.2.
        shell: bash
        run: |
          export PATH="$(brew --prefix bash)/bin:$PATH"
          bash --version | head -1
          bats plugins/vsdd-factory/tests/wave-handoff.bats
          bats plugins/vsdd-factory/tests/wave-gate-hooks.bats

  bats-darwin-leg-macos:
    # Darwin-leg interpreter discipline gate (S-19.01 AC-004; ADR-030 §Decision 3).
    # Validates release.yml darwin-leg scripts under /bin/bash 3.2.x (Apple's
    # patched system bash), NOT Homebrew bash 5.x, to detect bash 3.2 regressions
    # before they reach production macOS runners.
    #
    # INTERPRETER DISCIPLINE: all generated temp scripts use #!/bin/bash.
    # /bin/bash 3.2 preflight is the drift sentinel: if Apple ships a future
    # macOS release with a different system bash, the preflight catches it.
    #
    # L-BB-simulation-shell-dialect-gap (D-750): this job closes the gap where
    # scripts failed on macOS CI (bash 3.2.57) but passed locally (Homebrew 5.x).
    #
    # BLOCKING: required status check equivalent — same on: trigger as other jobs.
    #
    # S-19.01 (implemented): pr-manager-hardening.bats darwin-leg test suite.
    # The AC-004 literal CI-config gate (O-P15-04) requires this exact key:
    #   grep -qE '^  bats-darwin-leg-macos:$' .github/workflows/ci.yml
    #
    # SCOPE: runs pr-manager-hardening.bats on macOS under /bin/bash 3.2.x.
    #   T-001 skips if factory-dispatcher not pre-built (set-up step copies from
    #   the bundled darwin binary to target/release/ to enable T-001).
    #   T-009 skips on Darwin (EC-003: Linux-runner test).
    name: bats-darwin-leg (macos, /bin/bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bats
        run: brew install bats-core jq

      - name: Verify /bin/bash is 3.2.x (drift sentinel)
        run: |
          /bin/bash --version | head -1
          /bin/bash --version | head -1 | grep -q "version 3\.2" || {
            echo "DARWIN_LEG_WRONG_INTERPRETER: expected /bin/bash 3.2.x, got $(/bin/bash --version | head -1)" >&2
            exit 1
          }
          echo "Interpreter OK: $(/bin/bash --version | head -1)"

      - name: Set up dispatcher binary for T-001
        # T-001 looks for target/release/factory-dispatcher. Copy the pre-built
        # darwin binary from the repository bundle to avoid a full cargo build
        # (~15 min) on each macOS CI run. Architecture detection selects
        # darwin-arm64 (M1/M2/M3 runner) or darwin-x64 (Intel runner).
        run: |
          mkdir -p target/release
          ARCH="$(uname -m)"
          if [[ "${ARCH}" == "arm64" ]]; then
            DARWIN_BIN="plugins/vsdd-factory/hooks/dispatcher/bin/darwin-arm64/factory-dispatcher"
          else
            DARWIN_BIN="plugins/vsdd-factory/hooks/dispatcher/bin/darwin-x64/factory-dispatcher"
          fi
          cp "${DARWIN_BIN}" target/release/factory-dispatcher
          chmod +x target/release/factory-dispatcher
          echo "Dispatcher: $(target/release/factory-dispatcher --version 2>/dev/null || echo 'binary staged')"

      - name: Install Rust wasm32-wasip1 target
        # pr-manager-hardening.bats setup_file() builds pr-manager-completion-guard.wasm
        # on first use when the WASM is absent (not tracked in the repo per F-S1901-P1-002).
        # Rust is pre-installed on macos-latest; this step adds the cross-compile target.
        run: rustup target add wasm32-wasip1

      - name: Run pr-manager-hardening bats suite (darwin-leg)
        # Runs pr-manager-hardening.bats on macOS under /bin/bash 3.2.x.
        # T-009 legitimately skips on Darwin (EC-003).
        # darwin-leg-preflight.sh is invoked by T-008/T-009 under /bin/bash.
        # setup_file() builds pr-manager-completion-guard.wasm if absent (T-001 gate).
        run: |
          bats plugins/vsdd-factory/tests/pr-manager-hardening.bats
