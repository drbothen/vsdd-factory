  - id: 8
    name: bc_array_changes_propagate_to_body_and_acs
    description: "When a story bcs: frontmatter changes, the same commit must update body BC table, ACs, and Token Budget count."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [story, bc]
    lint_hook: null
    codified_at: null
    verification_steps:
      - "Sample 5+ stories — for each BC in behavioral_contracts: frontmatter (canonical field; alias: bcs: for S-15.03 only), verify it appears in body BC table"
      - "For each BC in behavioral_contracts: frontmatter, verify at least one AC traces to it"
      - "For each BC in body BC table or AC traces, verify it appears in behavioral_contracts: frontmatter"
      - "Verify Token Budget BC count matches len(behavioral_contracts)"
      - "After any PC insertion/deletion/renumbering in BC, story-writer MUST run literal-shell bidirectional AC↔PC parity check (grep PC cites in story per PC in BC; grep BC for each AC PC cite) with captured stdout per POLICY 15. Captured stdout MUST appear in fix-burst commit body or story §Bidirectional Parity Audit Note. Prevents cascade-propagation-gap-from-PC-insertion (META-LEVEL-31 CANDIDATE; D-515)."
      - "AUDIT-BLOCK EXCLUSION MANDATE (v1.2; F-SP3-014 META-LEVEL-31 cure-of-cure): The parity check grep MUST exclude the audit block itself from the grep target to prevent self-counting false-positives. Implement via ONE of: (a) sed strip before grep: `sed '/^## Bidirectional Parity Audit Note/,/^## /d' story.md | grep -c \"BC-5.39.009 PC6\"` (strip audit section before counting); OR (b) explicit AC-per-PC listing: audit MUST list AC numbers per PC explicitly (e.g., 'PC6: AC-7' instead of 'PC6: 1 cite') — so self-counting produces no false-positive (the audit line says 'AC-7' not a count that would increment). A parity audit whose grep target includes the audit block's own stdout is structurally self-counting and constitutes a MEDIUM-severity finding per META-LEVEL-31."
      - "EC-MIRROR ROUTING-RULE (v1.3; D-517 F-SP4-016 process-gap closure): When a story adds an Edge Case (EC) row that references a BC anchor (PC, invariant, AC-class, or §Architecture Anchors), the orchestrator MUST dispatch a same-burst PO mirror task. The PO mirror MUST add an equivalent EC row in the BC with consistent ID and trigger/expected-behavior/test-vector form. The story-writer MUST NOT leave `[needs-po]` placeholder text in the story for EC mirrors deferred across bursts (closes F-SP4-016). The story-writer is responsible for flagging new ECs with `[needs-po-mirror]` to signal the orchestrator. Adversary MUST verify: for any EC in the story body that names a BC PC, an equivalent EC exists in the BC body with matching semantics."

  - id: 9
    name: vp_index_is_vp_catalog_source_of_truth
    description: "VP-INDEX.md is authoritative. Changes must propagate same-burst to verification-architecture.md and verification-coverage-matrix.md."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, lint-hook, consistency-validator]
    scope: [vp, architecture]
    lint_hook: hooks/validate-vp-consistency.sh
    codified_at: "D-472"
